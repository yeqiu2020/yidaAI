name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（如不填则从 package.json 读取）'
        required: false
        type: string

jobs:
  # ── 三平台冒烟测试 ──────────────────────────────────
  smoke-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install package globally
        run: npm install -g . --ignore-scripts

      - name: Verify CLI
        run: |
          yida-helper version
          yida-helper help
          yida-helper run hello-world-custom/scripts/main.js

      - name: Verify postinstall (simulate)
        run: node scripts/postinstall.js
        continue-on-error: true

  # ── 发布到 npm ────────────────────────────────────
  publish:
    needs: smoke-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'
          always-auth: true

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run tests (non-blocking)
        run: npm run test:core || echo "No core tests or tests failed (non-blocking)"
        continue-on-error: true

      - name: Check npm registry info
        run: npm info yidaai version || echo "Package not yet published"

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ── 创建 skills.zip 作为 Release 附件 ──────────────
      - name: Create skills.zip
        run: |
          zip -r skills.zip .agents/skills/ -x "*/node_modules/*" "*/.cache/*" "*/.form-counter" "*/storageState.json" "*.png"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
          files: skills.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
